# video-h5.pomelo7.top
# 浏览器只访问 /api-video-pomelo7-server，由这里转发到片库、封面和播放地址。
# 证书放到 conf/cert/video-h5.pomelo7.top.pem 与 .key
# 静态目录 /home/sunjun/projects/mobile/video-h5

# 片库连接复用。名字在所有 vhost 里不能重复；vod 里的 proxy_http_version 1.1 和 Connection "" 不能删。
upstream video_h5_dushe {
	server www.dushe05.com:443;
	keepalive 16;
	keepalive_timeout 20s;
}

server {
	listen       80;
	server_name  video-h5.pomelo7.top;

	access_log  /data/nginx/logs/http/access.video-h5.pomelo7.top.log  main;
	access_log on;

	gzip on;
	gzip_http_version 1.1;
	gzip_min_length 1000;
	gzip_buffers 256 64k;
	gzip_comp_level 5;
	gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain text/xml;
	gzip_vary on;

	root /home/sunjun/projects/mobile/video-h5;
	index  index.html index.htm;

	add_header Access-Control-Allow-Origin *;
	add_header Access-Control-Allow-Headers Origin,Accept,Authorization,platformId,ut,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type;
	add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
	add_header Access-Control-Allow-Credentials true;

	location /assets/ {
		expires 1y;
		try_files $uri =404;
	}

	# 入口页每次都向服务器确认，发版后马上用上新版本；带 hash 的 assets 照样长缓存。
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	# 片库页面。浏览器校验写在本站 Cookie 里，这里原样带给上游。
	location /api-video-pomelo7-server/vod/ {
		proxy_pass https://video_h5_dushe/;
		proxy_http_version 1.1;
		proxy_ssl_server_name on;
		proxy_ssl_name www.dushe05.com;
		proxy_ssl_verify off;
		proxy_set_header Host www.dushe05.com;
		proxy_set_header Connection "";
		proxy_set_header Referer "https://www.dushe05.com/";
		proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
		proxy_set_header Cookie $http_cookie;
		proxy_hide_header Set-Cookie;
	}

	location /api-video-pomelo7-server/img/ {
		proxy_pass https://vres.wkcyvs.cn/;
		proxy_http_version 1.1;
		proxy_ssl_server_name on;
		proxy_ssl_verify off;
		proxy_set_header Host vres.wkcyvs.cn;
		proxy_set_header Connection "";
		proxy_set_header Referer "https://www.dushe05.com/";
		proxy_set_header Cookie "";
		proxy_set_header Accept-Encoding "";
		expires 1d;
	}

	location /api-video-pomelo7-server/img-a/ {
		proxy_pass https://103.39.111.180:51050/;
		proxy_http_version 1.1;
		proxy_ssl_server_name on;
		proxy_ssl_name 103.39.111.180;
		proxy_ssl_verify off;
		proxy_set_header Host 103.39.111.180:51050;
		proxy_set_header Connection "";
		proxy_set_header Referer "https://www.dushe05.com/";
		proxy_set_header Cookie "";
		proxy_set_header Accept-Encoding "";
		expires 1d;
	}

	location /api-video-pomelo7-server/img-b/ {
		proxy_pass https://103.39.111.184:51050/;
		proxy_http_version 1.1;
		proxy_ssl_server_name on;
		proxy_ssl_name 103.39.111.184;
		proxy_ssl_verify off;
		proxy_set_header Host 103.39.111.184:51050;
		proxy_set_header Connection "";
		proxy_set_header Referer "https://www.dushe05.com/";
		proxy_set_header Cookie "";
		proxy_set_header Accept-Encoding "";
		expires 1d;
	}

	# 播放地址主机不固定，路径里带上协议、主机和端口。跳转改回本站前缀，避免浏览器直连。
	location ~* ^/api-video-pomelo7-server/play/(?<play_scheme>https?)/(?<play_host>[^/]+)/(?<play_port>\d+)(?<play_path>/.*)$ {
		resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
		resolver_timeout 5s;
		if ($play_host ~* "^(127\.|10\.|0\.|192\.168\.|169\.254\.|localhost)") {
			return 403;
		}
		if ($play_host ~* "^172\.(1[6-9]|2[0-9]|3[0-1])\.") {
			return 403;
		}
		set $play_backend $play_scheme://$play_host:$play_port;
		set $play_host_header $play_host:$play_port;
		if ($play_port = 80) {
			set $play_host_header $play_host;
		}
		if ($play_port = 443) {
			set $play_host_header $play_host;
		}
		proxy_pass $play_backend$play_path$is_args$args;
		proxy_http_version 1.1;
		proxy_ssl_server_name on;
		proxy_ssl_name $play_host;
		proxy_ssl_verify off;
		proxy_set_header Host $play_host_header;
		proxy_set_header Connection "";
		proxy_set_header Cookie "";
		proxy_set_header Referer "https://www.dushe05.com/";
		proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
		proxy_set_header Accept-Encoding "";
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 300s;
		proxy_redirect ~*^https://([^/:]+):(\d+)(/.*)$ /api-video-pomelo7-server/play/https/$1/$2$3;
		proxy_redirect ~*^http://([^/:]+):(\d+)(/.*)$ /api-video-pomelo7-server/play/http/$1/$2$3;
		proxy_redirect ~*^https://([^/:]+)(/.*)$ /api-video-pomelo7-server/play/https/$1/443$2;
		proxy_redirect ~*^http://([^/:]+)(/.*)$ /api-video-pomelo7-server/play/http/$1/80$2;
		proxy_redirect / /api-video-pomelo7-server/play/$play_scheme/$play_host/$play_port/;
	}

	location /api-video-pomelo7-server/ {
		default_type text/plain;
		return 404;
	}

	error_page  404              /404.html;
	error_page   500 502 503 504  /50x.html;
	location = /50x.html {
		root   html;
	}
}

